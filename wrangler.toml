name = "blog"
compatibility_date = "2026-09-27"

# 关闭预览 URL（对应控制台里的 Preview deployments）
preview_urls = false

# 自定义域名：wrangler deploy 时自动创建并维护 Custom Domain
# www 绑定到 Worker 只是为了让 Cloudflare 自动创建其 Proxied DNS 记录，
# 实际请求会先被 Redirect Rule（www -> anl.gg）接管
routes = [
  { pattern = "anl.gg", custom_domain = true },
  { pattern = "www.anl.gg", custom_domain = true }
]

# wrangler deploy 之前先构建站点，让仓库自包含，
# 不依赖控制台里的 Build command 字段
[build]
command = "bundle exec jekyll build"

# Jekyll 构建产物作为静态资源，不需要 Worker 脚本逻辑
[assets]
directory = "./_site"
not_found_handling = "404-page"
